# Release workflow.
#
# Retention: after the assets for this tag are published, list GitHub releases
# newest first and keep only the two newest. Delete every release beyond those
# two, and delete its git tag as well. A repository that already has v0.1.0
# keeps that release when v0.2.0 is published, then drops v0.1.0 when a third
# release is published.
#
# Instruction sets: each x64 RID publishes three Native AOT binaries.
# IlcInstructionSet is a requirement, not a runtime light-up. The compiler
# folds Avx2.IsSupported and Avx512BW.IsSupported to constants for the chosen
# set, so a higher set will not start on an older CPU.
#   (unset)     x86-64-v2 baseline. SSE2 scan. Runs without AVX2 or AVX-512.
#   x86-64-v3   requires AVX2 (and the rest of v3). Asset suffix -avx2.
#   x86-64-v4   requires AVX-512F/BW/CD/DQ/VL. Asset suffix -avx512.
# arm64 (osx-arm64) publishes only the baseline. AVX2 and AVX-512 are skipped.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (0.2.0 or v0.2.0). Creates the tag on the selected ref when it is missing."
        required: true
        type: string

# contents: write is required to create the release, upload assets, push a tag,
# and delete older releases and tags. Unspecified scopes stay none.
permissions:
  contents: write

concurrency:
  group: ngrep-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and match Version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ver="${INPUT_VERSION#v}"
            if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version must look like 0.2.0 or v0.2.0." >&2
              exit 1
            fi
            tag="v${ver}"
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}" || true
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              sha=$(git rev-list -n 1 "refs/tags/${tag}")
              echo "Using existing ${tag} at ${sha}."
            else
              sha=$(git rev-parse HEAD)
              csproj=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/Ngrep/Ngrep.csproj | head -1)
              if [ "$ver" != "$csproj" ]; then
                echo "Refusing to create ${tag}: src/Ngrep/Ngrep.csproj Version is ${csproj}." >&2
                exit 1
              fi
              # GITHUB_TOKEN tag pushes do not start a second workflow run.
              git tag "$tag" "$sha"
              git push origin "refs/tags/${tag}"
              echo "Created ${tag} at ${sha}."
            fi
          else
            tag="$REF_NAME"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag ${tag} must look like v0.2.0." >&2
              exit 1
            fi
            sha=$(git rev-parse HEAD)
          fi

          git checkout --detach "$sha"
          csproj=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/Ngrep/Ngrep.csproj | head -1)
          if [ "${tag#v}" != "$csproj" ]; then
            echo "Tag ${tag} does not match src/Ngrep/Ngrep.csproj Version ${csproj}." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/Ngrep.Tests/Ngrep.Tests.csproj -c Release --nologo

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            optional: false
          - os: windows-latest
            rid: win-x64
            optional: false
          - os: macos-latest
            rid: osx-arm64
            optional: false
          # Cross x64 from the Apple Silicon runner. Skipped when that clang
          # target is missing, so the other RIDs still publish.
          - os: macos-latest
            rid: osx-x64
            optional: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Probe toolchain
        id: probe
        env:
          RID: ${{ matrix.rid }}
          OPTIONAL: ${{ matrix.optional }}
        run: |
          set -euo pipefail
          available=true
          if [ "$RID" = "osx-x64" ]; then
            if ! printf 'int main(void){return 0;}\n' | clang -arch x86_64 -x c -o "${RUNNER_TEMP}/ngrep-x64-probe" -; then
              echo "osx-x64 cross toolchain is not available on this runner; skipping."
              available=false
            fi
          fi
          if [ "$available" = "false" ] && [ "${OPTIONAL:-false}" != "true" ]; then
            echo "Required RID ${RID} has no toolchain." >&2
            exit 1
          fi
          echo "available=${available}" >> "$GITHUB_OUTPUT"

      - name: Publish Native AOT
        id: publish
        if: steps.probe.outputs.available == 'true'
        continue-on-error: ${{ matrix.optional == true }}
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # suffix is empty for the x86-64-v2 baseline. isa empty means unset.
          publish_one() {
            local suffix="$1"
            local isa="$2"
            local out="build-out/${suffix:-baseline}"
            local args=(src/Ngrep/Ngrep.csproj -c Release -r "$RID" -o "$out")
            if [ -n "$isa" ]; then
              args+=("/p:IlcInstructionSet=${isa}")
            fi
            dotnet publish "${args[@]}"

            local bin="ngrep"
            local asset="ngrep-${RID}"
            if [ "$RID" = "win-x64" ]; then
              bin="ngrep.exe"
              if [ -n "$suffix" ]; then
                asset="ngrep-win-x64-${suffix}.exe"
              else
                asset="ngrep-win-x64.exe"
              fi
            elif [ -n "$suffix" ]; then
              asset="ngrep-${RID}-${suffix}"
            fi
            cp "${out}/${bin}" "dist/${asset}"
            if [ "$RID" != "win-x64" ]; then
              chmod +x "dist/${asset}"
            fi
          }

          publish_one "" ""
          case "$RID" in
            linux-x64|win-x64|osx-x64)
              publish_one avx2 x86-64-v3
              publish_one avx512 x86-64-v4
              ;;
            *)
              echo "Skipping AVX2 and AVX-512 for ${RID}; those instruction sets are x64-only."
              ;;
          esac
          ls -lh dist

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.available == 'true' && steps.publish.outcome == 'success'
        with:
          name: ngrep-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ngrep-*
          merge-multiple: true
          path: assets

      - name: Publish release and keep the two newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(assets/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets were built." >&2
            exit 1
          fi
          for required in \
            ngrep-linux-x64 ngrep-linux-x64-avx2 ngrep-linux-x64-avx512 \
            ngrep-win-x64.exe ngrep-win-x64-avx2.exe ngrep-win-x64-avx512.exe \
            ngrep-osx-arm64
          do
            if [ ! -f "assets/${required}" ]; then
              echo "Missing required asset ${required}." >&2
              exit 1
            fi
          done
          notes=$(mktemp)
          {
            echo "ngrep ${TAG}"
            echo
            echo "Native AOT binaries. The Windows asset ends in .exe."
            echo "Names with no ISA suffix are the x86-64-v2 baseline (or arm64 for osx-arm64) and run without AVX2 or AVX-512."
            echo "Names ending in -avx2 require x86-64-v3 (AVX2) and will not run without it."
            echo "Names ending in -avx512 require x86-64-v4 (AVX-512) and will not run without it."
            echo "osx-arm64 has no AVX assets."
            echo
            echo "Assets:"
            for file in "${files[@]}"; do
              echo "- $(basename "$file")"
            done
            echo
            echo "Only the two newest GitHub releases are kept. Older releases and their tags are deleted after this publish."
          } > "$notes"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --notes-file "$notes"
          fi

          found=false
          tags=()
          for _ in 1 2 3 4 5; do
            mapfile -t tags < <(gh release list --limit 100 --exclude-drafts --json tagName,publishedAt \
              --jq '[.[] | select(.publishedAt != null)] | sort_by(.publishedAt) | reverse | .[].tagName')
            found=false
            for rel in "${tags[@]}"; do
              if [ "$rel" = "$TAG" ]; then
                found=true
                break
              fi
            done
            if [ "$found" = "true" ]; then
              break
            fi
            sleep 2
          done
          if [ "$found" != "true" ]; then
            echo "Release ${TAG} is not listed yet; leaving older releases in place." >&2
            exit 1
          fi

          kept=0
          for rel in "${tags[@]}"; do
            kept=$((kept + 1))
            if [ "$kept" -le 2 ]; then
              echo "Keeping ${rel}."
              continue
            fi
            echo "Deleting release and tag ${rel}."
            gh release delete "$rel" --yes --cleanup-tag
          done
