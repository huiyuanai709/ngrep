# Release workflow.
#
# Retention: after the assets for this tag are published, list GitHub releases
# newest first and keep only the two newest. Delete every release beyond those
# two, and delete its git tag as well. A repository that already has v0.1.0
# keeps that release when v0.2.0 is published, then drops v0.1.0 when a third
# release is published.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (0.2.0 or v0.2.0). Creates the tag on the selected ref when it is missing."
        required: true
        type: string

# contents: write is required to create the release, upload assets, push a tag,
# and delete older releases and tags. Unspecified scopes stay none.
permissions:
  contents: write

concurrency:
  group: netgrep-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and match Version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ver="${INPUT_VERSION#v}"
            if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version must look like 0.2.0 or v0.2.0." >&2
              exit 1
            fi
            tag="v${ver}"
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}" || true
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              sha=$(git rev-list -n 1 "refs/tags/${tag}")
              echo "Using existing ${tag} at ${sha}."
            else
              sha=$(git rev-parse HEAD)
              csproj=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/Netgrep/Netgrep.csproj | head -1)
              if [ "$ver" != "$csproj" ]; then
                echo "Refusing to create ${tag}: src/Netgrep/Netgrep.csproj Version is ${csproj}." >&2
                exit 1
              fi
              # GITHUB_TOKEN tag pushes do not start a second workflow run.
              git tag "$tag" "$sha"
              git push origin "refs/tags/${tag}"
              echo "Created ${tag} at ${sha}."
            fi
          else
            tag="$REF_NAME"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag ${tag} must look like v0.2.0." >&2
              exit 1
            fi
            sha=$(git rev-parse HEAD)
          fi

          git checkout --detach "$sha"
          csproj=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/Netgrep/Netgrep.csproj | head -1)
          if [ "${tag#v}" != "$csproj" ]; then
            echo "Tag ${tag} does not match src/Netgrep/Netgrep.csproj Version ${csproj}." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/Netgrep.Tests/Netgrep.Tests.csproj -c Release --nologo

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            optional: false
          - os: windows-latest
            rid: win-x64
            optional: false
          - os: macos-latest
            rid: osx-arm64
            optional: false
          # Cross x64 from the Apple Silicon runner. Skipped when that clang
          # target is missing, so the other RIDs still publish.
          - os: macos-latest
            rid: osx-x64
            optional: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Probe toolchain
        id: probe
        env:
          RID: ${{ matrix.rid }}
          OPTIONAL: ${{ matrix.optional }}
        run: |
          set -euo pipefail
          available=true
          if [ "$RID" = "osx-x64" ]; then
            if ! printf 'int main(void){return 0;}\n' | clang -arch x86_64 -x c -o "${RUNNER_TEMP}/netgrep-x64-probe" -; then
              echo "osx-x64 cross toolchain is not available on this runner; skipping."
              available=false
            fi
          fi
          if [ "$available" = "false" ] && [ "${OPTIONAL:-false}" != "true" ]; then
            echo "Required RID ${RID} has no toolchain." >&2
            exit 1
          fi
          echo "available=${available}" >> "$GITHUB_OUTPUT"

      - name: Publish Native AOT
        id: publish
        if: steps.probe.outputs.available == 'true'
        continue-on-error: ${{ matrix.optional == true }}
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          dotnet publish src/Netgrep/Netgrep.csproj -c Release -r "$RID"
          mkdir -p dist
          if [ "$RID" = "win-x64" ]; then
            matches=(src/Netgrep/bin/Release/*/win-x64/publish/netgrep.exe)
            cp "${matches[0]}" dist/netgrep-win-x64.exe
          else
            matches=(src/Netgrep/bin/Release/*/"$RID"/publish/netgrep)
            cp "${matches[0]}" "dist/netgrep-${RID}"
            chmod +x "dist/netgrep-${RID}"
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.available == 'true' && steps.publish.outcome == 'success'
        with:
          name: netgrep-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: netgrep-*
          merge-multiple: true
          path: assets

      - name: Publish release and keep the two newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(assets/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets were built." >&2
            exit 1
          fi
          for required in netgrep-linux-x64 netgrep-win-x64.exe netgrep-osx-arm64; do
            if [ ! -f "assets/${required}" ]; then
              echo "Missing required asset ${required}." >&2
              exit 1
            fi
          done
          notes=$(mktemp)
          {
            echo "netgrep ${TAG}"
            echo
            echo "Native AOT binaries. The Windows asset ends in .exe."
            echo
            echo "Assets:"
            for file in "${files[@]}"; do
              echo "- $(basename "$file")"
            done
            echo
            echo "Only the two newest GitHub releases are kept. Older releases and their tags are deleted after this publish."
          } > "$notes"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --notes-file "$notes"
          fi

          found=false
          tags=()
          for _ in 1 2 3 4 5; do
            mapfile -t tags < <(gh release list --limit 100 --exclude-drafts --json tagName,publishedAt \
              --jq '[.[] | select(.publishedAt != null)] | sort_by(.publishedAt) | reverse | .[].tagName')
            found=false
            for rel in "${tags[@]}"; do
              if [ "$rel" = "$TAG" ]; then
                found=true
                break
              fi
            done
            if [ "$found" = "true" ]; then
              break
            fi
            sleep 2
          done
          if [ "$found" != "true" ]; then
            echo "Release ${TAG} is not listed yet; leaving older releases in place." >&2
            exit 1
          fi

          kept=0
          for rel in "${tags[@]}"; do
            kept=$((kept + 1))
            if [ "$kept" -le 2 ]; then
              echo "Keeping ${rel}."
              continue
            fi
            echo "Deleting release and tag ${rel}."
            gh release delete "$rel" --yes --cleanup-tag
          done
